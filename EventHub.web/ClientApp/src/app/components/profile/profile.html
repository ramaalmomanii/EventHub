<div class="profile-container" *ngIf="user()">
  <!--  Avatar  -->
  <div class="profile-header">
    <div class="avatar">
      <img src="assets/avatar-placeholder.png" alt="User Avatar">
      <button class="edit-btn" (click)="editProfile()">✏️ Edit</button>
    </div>
    <div class="user-info">
      <h2>{{ user().fullName }}</h2>
      <p>{{ user().role }}</p>
    </div>
  </div>

  <!--  Events -->
  <div class="profile-events">
    <h3>Recorded events</h3>
    <table>
      <thead>
        <tr> tt</tr>
      </thead>
      <tbody>
        <tr> tt</tr>
      </tbody>
    </table>
    <ul>
      <li *ngFor="let event of user().events">{{ event.name }} - {{ event.date | date }}</li>
    </ul>
  </div>
</div>

<!-- Loader -->
<div *ngIf="loading()" class="loader">تحميل...</div>

<!-- Error Message -->
<div *ngIf="errorMsg()" class="error-msg">{{ errorMsg() }}</div>
