<div class="ai-summary" [class.compact]="compact">
  <div class="ai-header">
    <div class="ai-title-row">
      <span class="ai-icon">✨</span>
      <h3 class="ai-title">AI Summary</h3>
    </div>
    <div class="provider-toggle">
      <button class="toggle-btn"
              [class.active]="provider === 'openai'"
              (click)="switchProvider('openai')">
        OpenAI
      </button>
      <button class="toggle-btn"
              [class.active]="provider === 'gemini'"
              (click)="switchProvider('gemini')">
        Gemini
      </button>
    </div>
  </div>

  @if (loading) {
  <div class="ai-loading">
    <span class="spinner"></span>
    Generating summary...
  </div>
  } @else if (error) {
  <div class="ai-error">
    <p>{{ error }}</p>
    <button class="btn-retry" (click)="retry()">Retry</button>
  </div>
  } @else if (summary) {
  <p class="ai-text">{{ summary }}</p>
  }
</div>
