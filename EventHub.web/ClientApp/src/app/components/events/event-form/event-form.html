<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">{{ isEditMode ? 'Edit Event' : 'New Event' }}</h1>
      <p class="page-subtitle">{{ isEditMode ? 'Update event details' : 'Create a new event' }}</p>
    </div>
    <!--<button class="btn-secondary" (click)="cancel()">← Back</button>-->
  </div>

  @if (error) {
  <div class="error-banner">{{ error }}</div>
  }
  @if (successMessage) {
  <div class="success-popup">
    <span class="success-icon">✓</span>
    {{ successMessage }}
  </div>
  }

  @if (loading) {
  <div class="loading-state">Loading event...</div>
  } @else {
  <div class="form-card">
    <div class="form-section">
      <h2 class="section-title">Basic Info</h2>

      <div class="form-group">
        <label class="form-label">Title <span class="required">*</span></label>
        <input class="form-input" type="text" [(ngModel)]="form.title" placeholder="Event title" />
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" [(ngModel)]="form.description" rows="4" maxlength="200" placeholder="Describe your event..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category <span class="required">*</span></label>
          <select class="form-select" [(ngModel)]="form.categoryId">
            <option [ngValue]="0" disabled>Select category</option>
            @for (cat of categories; track cat.id) {
            <option [ngValue]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Location</label>
          <input class="form-input" type="text" [(ngModel)]="form.location" placeholder="City or venue" />
        </div>
      </div>
    </div>

    <div class="form-divider"></div>

    <div class="form-section">
      <h2 class="section-title">Date & Time</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Start Date <span class="required">*</span></label>
          <input class="form-input" type="datetime-local" [(ngModel)]="form.startDate" />
        </div>
        <div class="form-group">
          <label class="form-label">End Date <span class="required">*</span></label>
          <input class="form-input" type="datetime-local" [(ngModel)]="form.endDate" />
        </div>
      </div>
    </div>

    <div class="form-divider"></div>

    <div class="form-section">
      <h2 class="section-title">Capacity & Pricing</h2>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Price ($)</label>
          <input class="form-input" type="number" [(ngModel)]="form.price" min="0" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Capacity</label>
          <input class="form-input" type="number" [(ngModel)]="form.capacity" min="1" placeholder="100" />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-secondary" (click)="cancel()">Cancel</button>
      <button class="btn-primary" [disabled]="saving" (click)="submit()">
        {{ saving ? 'Saving...' : (isEditMode ? 'Save Changes' : 'Create Event') }}
      </button>
    </div>
  </div>
  }
</div>
