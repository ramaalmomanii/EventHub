<header class="main-header d-flex justify-content-between align-items-center p-2">
  <div class="logo">EventHub</div>

  <div class="user-avatar" (click)="toggleDropdown()">
    <img src="assets/imgs/avatar.png" alt="Avatar" class="avatar-img" />
    <div class="dropdown" *ngIf="showDropdown">
      <ul>
        <li *ngFor="let item of userMenuItems" (click)="item.command?.()">{{item.label}}</li>
      </ul>
    </div>
  </div>
</header>
