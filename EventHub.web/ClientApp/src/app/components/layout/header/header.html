<header class="main-header">
  <div class="header-left">
    <div class="logo">
      <i class="ti ti-calendar-event" aria-hidden="true"></i>
      EventHub
    </div>
  </div>

  <div class="header-right">
    <button class="icon-btn theme-btn"
            type="button"
            [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
            [title]="isDarkMode ? 'Light mode' : 'Dark mode'"
            (click)="toggleTheme()">
      <i class="ti" [ngClass]="isDarkMode ? 'ti-sun' : 'ti-moon'" aria-hidden="true"></i>
    </button>
    <button class="icon-btn">
      <i class="ti ti-bell" aria-hidden="true"></i>
    </button>

    <div class="avatar-wrap" (click)="toggleDropdown()">
      <div class="avatar">{{ initials }}</div>

      @if (dropdownOpen) {
      <div class="dropdown" (click)="$event.stopPropagation()">
        <div class="dropdown-user">
          <div class="avatar sm">{{ initials }}</div>
          <div>
            <div class="drop-name">{{ currentUser?.fullName ?? '' }}</div>
            <div class="drop-role">{{ currentUser?.role ?? '' }}</div>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="drop-item" (click)="goToProfile()">
          <i class="ti ti-user" aria-hidden="true"></i>
          My Profile
        </button>
        <div class="dropdown-divider"></div>
        <button class="drop-item danger" (click)="logout()">
          <i class="ti ti-logout" aria-hidden="true"></i>
          Logout
        </button>
      </div>
      }
    </div>
  </div>
</header>
